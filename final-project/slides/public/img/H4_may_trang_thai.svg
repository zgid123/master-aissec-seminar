<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 892 210" width="892" height="210" font-family="Roboto, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1E293B"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="892" height="210" fill="#FFFFFF"/>

  <!-- Start state -->
  <text x="32" y="70" text-anchor="middle" font-size="12" font-weight="600" fill="#64748B">Bắt đầu</text>
  <circle cx="32" cy="95" r="9" fill="#1E293B"/>
  <line x1="41" y1="95" x2="68" y2="95" stroke="#1E293B" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <!-- State 1: ACTIVE -->
  <rect x="75" y="55" width="220" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="185" y="88" text-anchor="middle" font-size="16" font-weight="800" fill="#065F46">ACTIVE</text>
  <text x="185" y="112" text-anchor="middle" font-size="14" font-weight="500" fill="#047857">Phiên đang hoạt động</text>

  <!-- Self-loop on ACTIVE -->
  <path d="M 145 55 C 145 20, 225 20, 225 50" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="185" y="18" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Sₜ &lt; h₁: tiếp tục</text>

  <!-- Arrow ACTIVE -> MFA_PENDING (forward) -->
  <line x1="295" y1="78" x2="370" y2="78" stroke="#1E293B" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
  <text x="335" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#B45309">h₁ ≤ Sₜ &lt; h₂</text>

  <!-- State 2: MFA_PENDING -->
  <rect x="375" y="55" width="220" height="80" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
  <text x="485" y="88" text-anchor="middle" font-size="16" font-weight="800" fill="#92400E">MFA_PENDING</text>
  <text x="485" y="112" text-anchor="middle" font-size="14" font-weight="500" fill="#B45309">Chờ xác thực lại</text>

  <!-- Arrow MFA_PENDING -> ACTIVE (success) -->
  <line x1="375" y1="112" x2="300" y2="112" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="335" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">MFA đạt: đặt lại Sₜ = 0</text>

  <!-- Arrow MFA_PENDING -> REVOKED (failure) -->
  <line x1="595" y1="95" x2="685" y2="95" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="640" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#DC2626">MFA trượt</text>

  <!-- State 3: REVOKED -->
  <rect x="690" y="55" width="185" height="80" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="782" y="88" text-anchor="middle" font-size="16" font-weight="800" fill="#991B1B">REVOKED</text>
  <text x="782" y="112" text-anchor="middle" font-size="14" font-weight="500" fill="#B91C1C">Phiên bị thu hồi</text>

  <!-- Direct Revocation: Curved arrow underneath from ACTIVE to REVOKED -->
  <path d="M 220 135 C 330 185, 680 185, 765 140" fill="none" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="495" y="200" text-anchor="middle" font-size="13.5" font-weight="700" fill="#B91C1C">
    Sₜ ≥ h₂: thu hồi ngay, kể cả trong cooldown
  </text>
</svg>
