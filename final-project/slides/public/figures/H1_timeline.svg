<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" font-family="Roboto, 'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <rect width="880" height="200" fill="#FFFFFF"/>

  <!-- Upper Description Blocks -->
  <text x="320" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1D4ED8">
    Phiên đã xác thực: máy chủ chỉ kiểm tra bí mật phiên
  </text>
  <text x="320" y="52" text-anchor="middle" font-size="15" fill="#1E40AF">
    (cookie hoặc token) ở mỗi yêu cầu
  </text>

  <text x="735" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#B91C1C">
    Khoảng hở
  </text>
  <text x="735" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#B91C1C">
    cần rút ngắn
  </text>

  <!-- Shaded Spans along Timeline -->
  <!-- Valid session span -->
  <rect x="120" y="78" width="480" height="20" rx="4" fill="#DBEAFE" opacity="0.8"/>
  <!-- Gap span -->
  <rect x="600" y="78" width="180" height="20" rx="4" fill="#FEE2E2" opacity="0.9"/>

  <!-- Main Timeline Axis -->
  <line x1="50" y1="88" x2="830" y2="88" stroke="#475569" stroke-width="3"/>
  <polygon points="840,88 826,82 826,94" fill="#475569"/>

  <!-- Key Event Points -->
  <!-- Point 1: 09:00 -->
  <circle cx="120" cy="88" r="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>

  <!-- Point 2: 13:20 -->
  <circle cx="600" cy="88" r="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="4"/>

  <!-- Point 3: 13:21 -->
  <circle cx="780" cy="88" r="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="4"/>

  <!-- Event Labels Below -->
  <!-- 09:00 -->
  <text x="120" y="122" text-anchor="middle" font-size="20" font-weight="800" fill="#0F172A">09:00</text>
  <text x="120" y="145" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">Người dùng đăng nhập</text>
  <text x="120" y="165" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">và qua MFA</text>

  <!-- 13:20 -->
  <text x="600" y="122" text-anchor="middle" font-size="20" font-weight="800" fill="#0F172A">13:20</text>
  <text x="600" y="145" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">Kẻ tấn công chiếm</text>
  <text x="600" y="165" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">phiên đang mở</text>

  <!-- 13:21 -->
  <text x="780" y="122" text-anchor="middle" font-size="20" font-weight="800" fill="#0F172A">13:21</text>
  <text x="780" y="145" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">Hệ thống cần phát hiện</text>
  <text x="780" y="165" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">và yêu cầu xác thực lại</text>

  <!-- Footnote -->
  <text x="440" y="192" text-anchor="middle" font-size="13" font-style="italic" fill="#94A3B8">
    Minh họa, không theo tỉ lệ thời gian
  </text>
</svg>
